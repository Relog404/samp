<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON // ARENA</title>
<style>
:root{color-scheme:dark;--cyan:#56e8ff;--violet:#a78bfa;--muted:#9ca9bb;--line:#ffffff20}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#f5f8ff}.hud{position:absolute;left:2.4vw;top:3.2vh;width:340px;padding:18px 20px 16px;border:1px solid #a0eaff3b;border-radius:15px;background:linear-gradient(135deg,#101b2beF,#0b1020d9 68%,#172139e8);box-shadow:0 14px 46px #03071270,inset 0 1px #ffffff12;backdrop-filter:blur(14px)}.head{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;font-size:15px;letter-spacing:.23em}.brand b{color:var(--cyan)}.live{font-size:9px;letter-spacing:.15em;color:#a8f4db}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5fffc3;box-shadow:0 0 10px #5fffc3;margin-right:6px}.sub{margin-top:5px;color:var(--muted);font-size:9px;letter-spacing:.2em;text-transform:uppercase}.divider{height:1px;background:linear-gradient(90deg,#56e8ff75,#ffffff12,transparent);margin:14px 0}.row{display:flex;align-items:center;justify-content:space-between;margin:10px 0}.label{color:#92a0b4;font-size:9px;letter-spacing:.15em;text-transform:uppercase}.value{font-size:12px;font-weight:700;letter-spacing:.045em}.pill{padding:5px 9px;border-radius:99px;background:#56e8ff16;color:var(--cyan);border:1px solid #56e8ff3d;font-size:9px;letter-spacing:.12em}.meter{height:3px;background:#ffffff18;border-radius:4px;margin-top:5px;overflow:hidden}.meter i{display:block;width:100%;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 10px #56e8ff}.foot{display:flex;justify-content:space-between;color:#7f8ca1;font-size:9px;letter-spacing:.1em}.key{padding:2px 6px;border:1px solid #ffffff30;border-radius:4px;color:#dce8f8}#map{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.glow{color:var(--cyan);text-shadow:0 0 16px #56e8ff66}
</style>
</head>
<body>
<section class="hud" aria-label="Arena HUD">
 <div class="head"><div><div class="brand">NEON <b>//</b> ARENA</div><div class="sub">Los Santos · Combat league</div></div><div class="live"><i class="dot"></i>LIVE</div></div>
 <div class="divider"></div>
 <div class="row"><span class="label">Локация</span><span class="value" id="map">UNITY STATION</span></div>
 <div class="row"><span class="label">Статус</span><span class="pill" id="state">HUB</span></div>
 <div class="row"><span class="label">Оружие</span><span class="value glow" id="weapon">—</span></div>
 <div class="row"><span class="label">Броня</span><span class="value" id="armor">—</span></div>
 <div id="botrow" style="display:none"><div class="row"><span class="label">AI · HP</span><span class="value" id="bot">100</span></div><div class="meter"><i id="bar"></i></div></div>
 <div class="divider"></div><div class="foot"><span>ДУЭЛЬНЫЙ ХАБ</span><span><i class="key">/arena</i> открыть меню</span></div>
</section>
<script>
(() => {
 const $=id=>document.getElementById(id);
 function update(map,state,weapon,armor,botHp){
  $('map').textContent=String(map||'UNITY STATION'); $('state').textContent=String(state||'HUB'); $('weapon').textContent=String(weapon||'—');
  $('armor').textContent=Number(armor)>0?`${armor}%`: '—';
  const active=String(state||'').includes('AI'); $('botrow').style.display=active?'block':'none';
  const hp=Math.max(0,Math.min(100,Number(botHp)||0)); $('bot').textContent=hp; $('bar').style.width=hp+'%';
 }
 if(window.cef&&typeof cef.on==='function') cef.on('arena:hud',update);
 window.addEventListener('DOMContentLoaded',()=>{});
})();
</script>
</body>
</html>
